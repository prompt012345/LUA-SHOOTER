name: LUA SHOOTER - WebAssembly Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout LUA SHOOTER
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            cmake \
            make \
            wget \
            zip \
            python3 \
            gettext \
            tcl

      - name: Inspect Luanti WebAssembly
        run: |
          git clone \
            --branch wasmgame \
            --single-branch \
            https://github.com/wasmga-me/luanti-wasm.git \
            luanti-wasm

          echo "========== BRANCH =========="
          git -C luanti-wasm branch --show-current

          echo "========== FILES =========="
          find luanti-wasm -maxdepth 4 -type f | sort

          echo "========== BUILD SCRIPT =========="
          if [ -f luanti-wasm/wasmgame/build.sh ]; then
            sed -n '1,180p' luanti-wasm/wasmgame/build.sh
          else
            echo "ERREUR : build.sh introuvable"
          fi

      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LUA-SHOOTER-DIAGNOSTIC
          path: luanti-wasm/
          if-no-files-found: warn
