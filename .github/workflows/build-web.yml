name: LUA SHOOTER - Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake make wget zip python3 gettext tcl

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Get Luanti source and patches
        run: |
          git clone --branch wasmgame \
            https://github.com/wasmga-me/luanti-wasm.git source

          git clone https://github.com/paradust7/minetest-wasm.git minetest-wasm

          git -C minetest-wasm checkout 5bfae52b53605b39667dfc29cddd59c861e38111

          echo "Checking required patches..."
          find source -name "*.diff" -o -name "*.patch"

          echo "Checking source history..."
          git -C source log --oneline -5

      - name: Stop if patches are missing
        run: |
          echo "The patch files must be recovered before compilation."
          exit 1
